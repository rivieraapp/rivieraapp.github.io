<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Page not found</title>
<meta name="description" content="This page does not exist.">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
  :root { --bg:#fbfbfd; --card:#fff; --line:#e3e3e8; --text:#1d1d1f; --muted:#636368; --link:#0062c4; --focus:#0a84ff; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0b0b0d; --card:#1b1b1e; --line:#2b2b30; --text:#f5f5f7; --muted:#a3a3a9; --link:#5eb0ff; --focus:#5eb0ff; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:17px/1.55 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-font-smoothing:antialiased; }
  main { max-width:640px; margin:0 auto; padding:72px 20px; }
  h1 { margin:0 0 8px; font-size:34px; letter-spacing:-.02em; }
  p.sub { margin:0 0 32px; color:var(--muted); }
  a.app { display:flex; gap:16px; align-items:center; padding:18px; border:1px solid var(--line); border-radius:20px; background:var(--card); color:var(--text); text-decoration:none; }
  a.app:hover { border-color:var(--muted); }
  a.app:focus-visible { outline:3px solid var(--focus); outline-offset:3px; }
  a.app img { width:64px; height:64px; border-radius:22.37%; flex:none; }
  a.app b { display:block; font-size:20px; }
  a.app span { color:var(--muted); font-size:16px; line-height:1.4; display:block; }
  p.small { margin:28px 0 0; font-size:14px; color:var(--muted); }
  a { color:var(--link); }
</style>
</head>
<body>
<main>
  <h1>Page not found</h1>
  <p class="sub">That address does not lead anywhere. Riviera’s page is here:</p>
    <a class="app" href="/">
      <img src="/img/icon-180.png" width="64" height="64" alt="">
      <div><b>Riviera — Car Companion</b><span>An independent, unofficial iPhone app for Renault connected cars. Screenshots, what it does and its privacy policy.</span></div>
    </a>
  
</main>
</body>
</html>
